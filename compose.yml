
services:
  postgres:
    image: postgres:17
    container_name: reservation-postgres
    environment:
      POSTGRES_DB: reservations_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck: # verifica se PostgreSQL sia pronto ad accettare connessioni
      test: ["CMD-SHELL", "pg_isready -U postgres -d reservations_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  reservation-service:
    build:
      context: ./reservationService
      dockerfile: Dockerfile
    container_name: reservation-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/reservations_db
      SPRING_DATASOURCE_USERNAME: postgres
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    



volumes:
  postgres_data:
