
services:
  postgres:
    image: postgres:17
    container_name: reservation-postgres
    environment:
      POSTGRES_DB: reservations_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck: # verifica se PostgreSQL sia pronto ad accettare connessioni
      test: ["CMD-SHELL", "pg_isready -U postgres -d reservations_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
